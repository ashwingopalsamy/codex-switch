name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Run deterministic fixture probe
        run: swift run CodexSwitchProbe fixture
      - name: Check whitespace
        run: git diff --check
