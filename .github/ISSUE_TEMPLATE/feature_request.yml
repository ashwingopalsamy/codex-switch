name: Feature request
description: Propose a scoped behavior improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and a testable outcome. Features must preserve profile isolation and privacy boundaries.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest behavior change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and tests.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Isolation and privacy risks
      description: Explain possible effects on roots, authentication, process lifecycle, recovery, or sensitive output.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included credentials, account identifiers, private conversations, or personal paths.
          required: true
